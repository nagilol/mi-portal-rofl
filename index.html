<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloQ Automated Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto custom-scrollbar">

  <!-- BARRA DE BÚSQUEDA AUTOMÁTICA -->
  <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 pb-4 border-b border-zinc-800">
    <h1 class="text-xl font-bold font-mono tracking-wider text-teal-400">SOLOQ<span class="text-white">_AUTOMATED</span></h1>
    
    <div class="flex items-center gap-2 w-full md:w-auto font-mono text-xs">
      <select id="region" class="bg-zinc-900 border border-zinc-800 px-3 py-2 rounded-lg text-zinc-300">
        <option value="las">LAS</option>
        <option value="lan">LAN</option>
        <option value="na">NA</option>
        <option value="euw">EUW</option>
        <option value="kr">KR</option>
      </select>
      <input type="text" id="riotId" placeholder="Invocador#TAG" value="Shavo#LAS" 
             class="bg-zinc-900 border border-zinc-800 px-3 py-2 rounded-lg text-white w-full md:w-64 focus:outline-none focus:border-teal-400">
      <button onclick="cargarDatos()" class="bg-teal-400 hover:bg-teal-300 text-zinc-950 font-bold px-4 py-2 rounded-lg transition">
        Cargar
      </button>
    </div>
  </header>

  <!-- PERFIL AUTOMATIZADO -->
  <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
    <div class="flex items-center gap-4">
      <img id="profileIcon" src="https://ddragon.leagueoflegends.com/cdn/14.5.1/img/profileicon/29.png" class="w-16 h-16 rounded-2xl border-2 border-teal-400">
      <div>
        <h2 id="summonerName" class="text-2xl font-bold font-mono text-white">---#---</h2>
        <p id="rankInfo" class="text-xs font-mono text-teal-400 mt-0.5">CARGANDO...</p>
      </div>
    </div>

    <!-- BOTÓN DIRECTO OP.GG -->
    <button onclick="irAOpGg()" class="flex items-center gap-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 px-5 py-2.5 rounded-xl font-mono text-xs transition">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
      Ver en OP.GG
    </button>
  </section>

  <!-- HISTORIAL AUTOMÁTICO DE PARTIDAS -->
  <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
    <h3 class="text-xs font-mono font-semibold text-zinc-400 tracking-wider mb-4">ÚLTIMAS PARTIDAS (AUTOMÁTICO RIOT API)</h3>
    <div id="matchList" class="space-y-3 font-mono text-xs">
      <p class="text-zinc-500">Haz clic en Cargar para obtener partidas en tiempo real...</p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
