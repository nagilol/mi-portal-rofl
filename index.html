<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Replays LoL (.ROFL)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="p-6 max-w-4xl mx-auto">

  <header class="text-center mb-8">
    <h1 class="text-2xl font-bold text-teal-400 tracking-wide">VISOR AUTOMÁTICO DE ARCHIVOS .ROFL</h1>
    <p class="text-xs text-zinc-400 mt-1">Extrae métricas reales a partir del ID de la partida</p>
  </header>

  <div onclick="document.getElementById('roflInput').click()" 
       class="border-2 border-dashed border-teal-500/50 hover:border-teal-400 bg-zinc-900/80 p-8 rounded-xl text-center cursor-pointer transition shadow-lg mb-8">
    <p class="text-sm font-semibold text-zinc-200">📁 Haz clic o arrastra tu archivo <span class="text-teal-400 font-mono font-bold">.rofl</span> aquí</p>
    <p class="text-[11px] text-zinc-500 mt-1">Detección automática de Match ID e integración con historial oficial</p>
    <input type="file" id="roflInput" accept=".rofl" class="hidden">
  </div>

  <div id="resultado" class="space-y-4"></div>

  <script>
    document.getElementById('roflInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name;
      // Extrae la región y el ID del nombre del archivo (ej: LA2-1627415322.rofl -> LA2_1627415322)
      const matchIdMatch = fileName.match(/([A-Za-z0-9]+)[_-](\d+)/);

      if (matchIdMatch) {
        const region = matchIdMatch[1].toLowerCase();
        const matchId = matchIdMatch[1].toUpperCase() + '_' + matchIdMatch[2];
        
        mostrarResultadoMatch(fileName, region, matchId);
      } else {
        alert("El nombre del archivo no contiene un ID de partida válido (ej: LA2-1627415322.rofl).");
      }
    });

    function mostrarResultadoMatch(fileName, region, matchId) {
      // Mapear regiones a op.gg
      const opggRegionMap = {
        'la1': 'lan',
        'la2': 'las',
        'na1': 'na',
        'euw1': 'euw',
        'eun1': 'eune',
        'kr': 'kr',
        'br1': 'br'
      };

      const opggRegion = opggRegionMap[region] || 'las';
      const opggUrl = `https://www.op.gg/matches/${opggRegion}/${matchId}`;

      let html = `
        <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-6 shadow-xl text-center">
          <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-6">
            <span class="text-xs font-mono text-teal-400 font-semibold">${fileName}</span>
            <span class="text-[11px] bg-teal-500/10 text-teal-300 border border-teal-500/20 px-2.5 py-0.5 rounded font-mono">MATCH ID DETECTADO</span>
          </div>

          <div class="my-6 p-4 bg-zinc-950/60 rounded-lg border border-zinc-800/80">
            <p class="text-xs text-zinc-400 mb-1">ID Único de Partida (Riot Games)</p>
            <p class="text-xl font-mono font-bold text-teal-400 tracking-wider">${matchId}</p>
          </div>

          <p class="text-xs text-zinc-300 mb-6 leading-relaxed">
            Los datos detallados de esta partida están registrados en los servidores de Riot.<br>Puedes consultar el desglose completo de la partida en OP.GG:
          </p>

          <a href="${opggUrl}" target="_blank" 
             class="inline-flex items-center justify-center gap-2 bg-teal-500 hover:bg-teal-400 text-zinc-950 font-bold px-6 py-3 rounded-lg text-xs transition shadow-lg shadow-teal-500/10">
            📊 Abrir Análisis Completo en OP.GG
          </a>
        </div>`;

      document.getElementById('resultado').innerHTML = html;
    }
  </script>
</body>
</html>
