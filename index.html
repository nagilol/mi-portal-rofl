<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Scrims LoL (.ROFL)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="p-6 max-w-5xl mx-auto">

  <header class="text-center mb-8">
    <h1 class="text-2xl font-bold text-teal-400 tracking-wide">PARSER DE SCRIMS & CUSTOM GAMES (.ROFL)</h1>
    <p class="text-xs text-zinc-400 mt-1">Extrae métricas reales de partidas privadas sin necesidad de la API de Riot</p>
  </header>

  <div onclick="document.getElementById('roflInput').click()" 
       class="border-2 border-dashed border-teal-500/50 hover:border-teal-400 bg-zinc-900/80 p-8 rounded-xl text-center cursor-pointer transition shadow-lg mb-8">
    <p class="text-sm font-semibold text-zinc-200">📁 Haz clic o arrastra la repetición de la <span class="text-teal-400 font-mono font-bold">Scrim (.rofl)</span> aquí</p>
    <p class="text-[11px] text-zinc-500 mt-1">Lector profundo de metadatos para partidas personalizadas</p>
    <input type="file" id="roflInput" accept=".rofl" class="hidden">
  </div>

  <div id="resultado" class="space-y-4"></div>

  <script>
    document.getElementById('roflInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const buffer = e.target.result;
        
        // Intentar extracción en UTF-8 y UTF-16
        let rawText = new TextDecoder('utf-8', { fatal: false }).decode(buffer);
        let playersData = extractStatsFromText(rawText);

        if (!playersData) {
          // Intento secundario con descompresión de texto binario
          const uint8 = new Uint8Array(buffer);
          let strLimpio = "";
          for (let i = 0; i < uint8.length; i++) {
            if (uint8[i] >= 32 && uint8[i] <= 126) {
              strLimpio += String.fromCharCode(uint8[i]);
            }
          }
          playersData = extractStatsFromText(strLimpio);
        }

        if (playersData && playersData.length > 0) {
          mostrarTablaScrim(playersData, file.name);
        } else {
          alert("No se pudieron leer los metadatos de esta scrim. Asegúrate de que la repetición no esté corrupta o incompleta.");
        }
      };

      // Leemos los primeros 500 KB del archivo donde se alojan los metadatos de la personalizada
      reader.readAsArrayBuffer(file.slice(0, 500 * 1024));
    });

    function extractStatsFromText(text) {
      try {
        const statsKey = '"statsJson":"';
        let startIndex = text.indexOf(statsKey);

        if (startIndex === -1) {
          // Búsqueda alternativa de la clave de estadísticas
          const altKey = 'statsJson';
          startIndex = text.indexOf(altKey);
          if (startIndex === -1) return null;
          startIndex = text.indexOf('[', startIndex);
        } else {
          startIndex += statsKey.length - 1;
        }

        const endIndex = text.indexOf(']"', startIndex) + 1;
        if (startIndex !== -1 && endIndex > startIndex) {
          let jsonStr = text.substring(startIndex, endIndex);
          // Limpiar caracteres de escape si existen
          jsonStr = jsonStr.replace(/\\"/g, '"').replace(/\\\\/g, '\\');
          const parsed = JSON.parse(jsonStr);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.error("Error analizando el bloque de stats:", e);
      }
      return null;
    }

    function mostrarTablaScrim(players, fileName) {
      let html = `
        <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-5 shadow-xl">
          <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
            <span class="text-xs font-mono text-teal-400 font-semibold">SCRIM: ${fileName}</span>
            <span class="text-[11px] bg-teal-500/10 text-teal-300 border border-teal-500/20 px-2.5 py-0.5 rounded font-mono">DATOS EXTRAÍDOS CON ÉXITO</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs font-mono">
              <thead>
                <tr class="text-zinc-400 border-b border-zinc-800 bg-zinc-950/50">
                  <th class="p-2.5">INVOCADOR</th>
                  <th class="p-2.5">CAMPEÓN</th>
                  <th class="p-2.5">K / D / A</th>
                  <th class="p-2.5">RESULTADO</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-800/50">`;

      players.forEach(p => {
        const isWin = p.WIN_TEAM_NAME === "FINAL_WINDOW_VICTORY" || p.WIN === "Win" || p.win === "1";
        const resText = isWin ? "Victoria" : "Derrota";
        const resColor = isWin ? "text-emerald-400 bg-emerald-500/10" : "text-rose-400 bg-rose-500/10";

        // Mapear el nombre del jugador o Skin
        const nombreInvocador = p.NAME || p.SUMMONER_NAME || 'Invocador';
        const campeon = p.SKIN || p.CHAMPION_NAME || 'Campeón';

        html += `
          <tr class="hover:bg-zinc-800/30">
            <td class="p-2.5 font-semibold text-zinc-200">${nombreInvocador}</td>
            <td class="p-2.5 text-zinc-300">${campeon}</td>
            <td class="p-2.5 text-zinc-400">${p.KILLS || 0} / ${p.DEATHS || 0} / ${p.ASSISTS || 0}</td>
            <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${resColor}">${resText}</span></td>
          </tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('resultado').innerHTML = html;
    }
  </script>
</body>
</html>
